name: checks

# The verification loop from README.md and web/build.sh, run by GitHub on
# every pull request against main, so a merge cannot skip them whoever makes it.
#
# Two jobs, because they are two different loops with two different runtimes:
#
#   passport  the skill and validator loop: scripts/build.sh and a check that the
#             committed skill is what it builds, tools/run_tests.sh, assemble the
#             example passport and validate it. Python only.
#   web       the same five commands Netlify's `command =` in web/netlify.toml runs
#             for the real deploy, not build.sh alone: build.sh (copies installer
#             text, renders the example page, runs the store-split guard, the web,
#             endpoint and social-card test suites, the validator parity check, the
#             route-table, html-twins, preflight-list and comment-balance checks,
#             and the served-clean and dist self-tests), then substitute.py (fills
#             the legal-entity placeholders in place, or leaves them as visible
#             slots when unset, which is what happens here with no such secrets
#             configured), then build-dist.py (builds web/dist, the only thing
#             Netlify publishes, from an allowlist, and fails if a page went
#             missing or anything private got in), then strip-served-comments.py
#             --deploy and check-served-clean.py, both against dist/, the files
#             as they will actually be served. Node and Python.
#
# ROW-486: until 2026-09-16 this job ran only build.sh. That is a weaker gate than
# the deploy: build.sh can pass while the deploy fails, which is exactly what
# happened when PR #17 merged clean here and then failed on Netlify, because
# strip-served-comments.py refused on a file build.sh never asks it to look at.
# A green PR must mean the deploy builds, so this job now runs the whole chain
# in the same order Netlify does, and no future PR can pass this gate on less.
#
# Neither job pushes or touches any deploy target; both run against the
# runner's own checkout. While the hosted site was live, Netlify deployed on its
# own when main moved; nothing in this repository deploys now.
# scripts/doctor.sh is deliberately not here: it checks the ~/.claude symlink on the
# developer's machine, which does not exist on a runner.
#
# Measured on a fresh checkout at 1828db2 (2026-09-16): passport loop 49 s, web
# build 23 s, both green. Re-measured 2026-09-16 after ROW-486 with the full
# four-command web chain in a throwaway worktree (not this repo's own tree,
# because substitute.py and strip-served-comments.py rewrite tracked source in
# place): all four commands green, 0 bytes changed under assets/installer/.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes, which can only
# ever report on code nobody will merge. A push to main is keyed by its commit
# instead, so every commit on main keeps a verdict of its own: when main goes
# red, the run that says which commit did it must not be the one cancelled.
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  passport:
    runs-on: ubuntu-latest
    # Measured 49 s on 2026-09-16. Without a limit a hung step holds the runner
    # for GitHub's default of six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python dependencies
        run: python3 -m pip install --quiet pyyaml jsonschema

      - name: Build the skill from its canonical sources
        run: ./scripts/build.sh

      # skills/agent-passport/ and spec/resolution.yaml are generated by the
      # step above and committed, because the skill folder is copied out of this
      # repository as it stands. A canonical file edited without a rebuild would
      # leave the shipped copy stale with every check green, since the steps below
      # test the rebuilt tree, not the committed one. Untracked files count too: a
      # new installer branch the build copies in, never committed, is a skill
      # shipped without it.
      - name: The committed skill matches its sources
        run: |
          git diff --exit-code -- skills/agent-passport spec/resolution.yaml
          untracked=$(git ls-files --others --exclude-standard -- skills/agent-passport spec/resolution.yaml)
          if [ -n "$untracked" ]; then
            echo "generated but not committed:"; echo "$untracked"
            exit 1
          fi

      - name: Validator and scrubber tests
        run: cd tools && ./run_tests.sh

      - name: Assemble and validate the example passport
        run: |
          python3 scripts/assemble.py examples/daily-brief-passport.md /tmp/out.md
          python3 tools/validate.py /tmp/out.md

  web:
    runs-on: ubuntu-latest
    # Measured 23 s for build.sh on 2026-09-16, with npm ci and the four
    # commands after it on top. node --test has no per-test timeout by default;
    # PH-570 (#57) had to give the sendMail never-answers test its own.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # Same major as the Netlify site's NODE_VERSION (24 since 2026-09-24, Raffael). The gate ran
      # 22 while Netlify built and served on 20, and a test that only cancels on some Nodes went
      # green here and failed the deploy of 74f03a8 (record/findings/the-merge-gate-tests-on-node-22-
      # and-netlify-builds-on-node-20-so-a-green-check-deployed-nothing-2026-09-24.md).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build the site
        run: ./build.sh

      - name: Substitute legal-entity placeholders
        run: python3 tools/substitute.py

      - name: Build the publish directory
        run: python3 tools/build-dist.py

      - name: Strip comments from served files
        run: python3 tools/strip-served-comments.py dist --deploy

      - name: Check the served tree is clean
        run: python3 tools/check-served-clean.py dist
